<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Idea Board</title>

    <!-- Tailwind CSS CDN with UAB custom colors -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            prefix: 'tw-',
            theme: {
                extend: {
                    colors: {
                        'uab-green': '#1A5632',
                        'dragons-lair-green': '#033319',
                        'campus-green': '#90D408',
                        'loyal-yellow': '#FDB913',
                        'smoke-gray': '#808285',
                        'smoke-gray-7': '#F5F5F5',
                        'smoke-gray-15': '#DADADA',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome 6 Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

    <style>
        .font-kulturista {
            font-family: "Kulturista", Georgia, "Times New Roman", serif !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body class="tw-bg-smoke-gray-7 tw-min-h-screen">
    <div class="tw-max-w-6xl tw-mx-auto tw-px-6 tw-py-12">
        <!-- Header -->
        <div class="tw-bg-white tw-p-8 tw-rounded-lg tw-shadow-md tw-mb-8">
            <h1 class="tw-text-uab-green tw-text-4xl tw-font-bold tw-mb-2 font-kulturista">
                Admin Panel
            </h1>
            <p class="tw-text-smoke-gray">Manage idea submissions</p>
        </div>

        <!-- Login Form (shown if not authenticated) -->
        <div id="loginForm" class="tw-bg-white tw-p-8 tw-rounded-lg tw-shadow-md tw-max-w-md tw-mx-auto">
            <h2 class="tw-text-uab-green tw-text-2xl tw-font-bold tw-mb-6">Admin Login</h2>
            <form onsubmit="handleLogin(event)">
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    class="tw-w-full tw-p-4 tw-border tw-border-smoke-gray-15 tw-rounded tw-mb-4 focus:tw-outline-none focus:tw-ring-2 focus:tw-ring-uab-green"
                    required
                />
                <button
                    type="submit"
                    class="tw-w-full tw-bg-uab-green tw-text-white tw-px-6 tw-py-3 tw-rounded hover:tw-bg-dragons-lair-green tw-transition-colors tw-font-medium"
                >
                    Login <i class="fas fa-sign-in-alt tw-ml-2"></i>
                </button>
            </form>
            <p class="tw-text-sm tw-text-smoke-gray tw-mt-4">
                <strong>Default password:</strong> admin123<br>
                <em>Change this in the script section</em>
            </p>
        </div>

        <!-- Admin Panel (hidden until authenticated) -->
        <div id="adminPanel" class="tw-hidden">
            <!-- Stats -->
            <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-3 tw-gap-6 tw-mb-8">
                <div class="tw-bg-white tw-p-6 tw-rounded-lg tw-shadow-md">
                    <div class="tw-text-smoke-gray tw-text-sm tw-mb-2">Total Ideas</div>
                    <div class="tw-text-4xl tw-font-bold tw-text-uab-green" id="totalIdeas">0</div>
                </div>
                <div class="tw-bg-white tw-p-6 tw-rounded-lg tw-shadow-md">
                    <div class="tw-text-smoke-gray tw-text-sm tw-mb-2">Total Votes</div>
                    <div class="tw-text-4xl tw-font-bold tw-text-campus-green" id="totalVotes">0</div>
                </div>
                <div class="tw-bg-white tw-p-6 tw-rounded-lg tw-shadow-md">
                    <button
                        onclick="logout()"
                        class="tw-w-full tw-bg-smoke-gray tw-text-white tw-px-4 tw-py-2 tw-rounded hover:tw-bg-smoke-gray-15 hover:tw-text-gray-800 tw-transition-colors"
                    >
                        <i class="fas fa-sign-out-alt tw-mr-2"></i> Logout
                    </button>
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="tw-bg-white tw-p-6 tw-rounded-lg tw-shadow-md tw-mb-8">
                <h3 class="tw-text-uab-green tw-text-xl tw-font-bold tw-mb-4">Bulk Actions</h3>
                <div class="tw-flex tw-gap-4 tw-flex-wrap">
                    <button
                        onclick="deleteAllIdeas()"
                        class="tw-bg-red-600 tw-text-white tw-px-6 tw-py-3 tw-rounded hover:tw-bg-red-700 tw-transition-colors"
                    >
                        <i class="fas fa-trash-alt tw-mr-2"></i> Delete All Ideas
                    </button>
                    <button
                        onclick="deleteOldIdeas()"
                        class="tw-bg-orange-600 tw-text-white tw-px-6 tw-py-3 tw-rounded hover:tw-bg-orange-700 tw-transition-colors"
                    >
                        <i class="fas fa-calendar-times tw-mr-2"></i> Delete Ideas Older than 30 Days
                    </button>
                    <button
                        onclick="loadIdeas()"
                        class="tw-bg-uab-green tw-text-white tw-px-6 tw-py-3 tw-rounded hover:tw-bg-dragons-lair-green tw-transition-colors"
                    >
                        <i class="fas fa-sync-alt tw-mr-2"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Ideas List -->
            <div id="ideasContainer" class="tw-bg-white tw-p-6 tw-rounded-lg tw-shadow-md">
                <h3 class="tw-text-uab-green tw-text-xl tw-font-bold tw-mb-4">All Submissions</h3>
                <div id="ideasList"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // CHANGE THIS PASSWORD!
        const ADMIN_PASSWORD = 'admin123';

        let isAuthenticated = false;

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;

            if (password === ADMIN_PASSWORD) {
                isAuthenticated = true;
                document.getElementById('loginForm').classList.add('tw-hidden');
                document.getElementById('adminPanel').classList.remove('tw-hidden');
                loadIdeas();
            } else {
                alert('Incorrect password!');
            }
        }

        function logout() {
            isAuthenticated = false;
            document.getElementById('loginForm').classList.remove('tw-hidden');
            document.getElementById('adminPanel').classList.add('tw-hidden');
            document.getElementById('adminPassword').value = '';
        }

        async function loadIdeas() {
            try {
                const { data, error } = await supabase
                    .from('ideas')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                renderIdeasList(data);
                updateStats(data);
            } catch (error) {
                console.error('Error loading ideas:', error);
                alert('Failed to load ideas');
            }
        }

        function updateStats(ideas) {
            const totalIdeas = ideas.length;
            const totalVotes = ideas.reduce((sum, idea) => sum + (idea.vote_count || 0), 0);

            document.getElementById('totalIdeas').textContent = totalIdeas;
            document.getElementById('totalVotes').textContent = totalVotes;
        }

        function renderIdeasList(ideas) {
            const container = document.getElementById('ideasList');

            if (ideas.length === 0) {
                container.innerHTML = '<p class="tw-text-smoke-gray tw-text-center tw-py-8">No ideas yet</p>';
                return;
            }

            container.innerHTML = ideas.map(idea => `
                <div class="tw-border-b tw-border-smoke-gray-15 tw-py-4 tw-flex tw-items-start tw-gap-4">
                    <div class="tw-flex-1">
                        <p class="tw-text-gray-800 tw-mb-2">${escapeHtml(idea.content)}</p>
                        <div class="tw-flex tw-gap-4 tw-text-sm tw-text-smoke-gray">
                            <span><i class="fas fa-arrow-up tw-mr-1"></i> ${idea.vote_count || 0} votes</span>
                            <span><i class="fas fa-clock tw-mr-1"></i> ${new Date(idea.created_at).toLocaleString()}</span>
                        </div>
                    </div>
                    <button
                        onclick="deleteIdea('${idea.id}')"
                        class="tw-bg-red-600 tw-text-white tw-px-4 tw-py-2 tw-rounded hover:tw-bg-red-700 tw-transition-colors tw-text-sm"
                    >
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `).join('');
        }

        async function deleteIdea(ideaId) {
            if (!confirm('Are you sure you want to delete this idea?')) return;

            try {
                const { error } = await supabase
                    .from('ideas')
                    .delete()
                    .eq('id', ideaId);

                if (error) throw error;

                alert('Idea deleted successfully');
                loadIdeas();
            } catch (error) {
                console.error('Error deleting idea:', error);
                alert('Failed to delete idea');
            }
        }

        async function deleteAllIdeas() {
            if (!confirm('Are you ABSOLUTELY sure you want to delete ALL ideas? This cannot be undone!')) return;
            if (!confirm('Last chance! Really delete ALL ideas?')) return;

            try {
                const { error } = await supabase
                    .from('ideas')
                    .delete()
                    .neq('id', '00000000-0000-0000-0000-000000000000'); // Delete all

                if (error) throw error;

                alert('All ideas deleted successfully');
                loadIdeas();
            } catch (error) {
                console.error('Error deleting ideas:', error);
                alert('Failed to delete ideas');
            }
        }

        async function deleteOldIdeas() {
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            if (!confirm('Delete all ideas older than 30 days?')) return;

            try {
                const { error } = await supabase
                    .from('ideas')
                    .delete()
                    .lt('created_at', thirtyDaysAgo.toISOString());

                if (error) throw error;

                alert('Old ideas deleted successfully');
                loadIdeas();
            } catch (error) {
                console.error('Error deleting old ideas:', error);
                alert('Failed to delete old ideas');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
